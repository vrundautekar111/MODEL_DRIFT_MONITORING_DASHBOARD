
services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data

  dashboard:
    build: .
    command: streamlit run dashboard/Home.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      SALESGUARD_API_URL: http://api:8000
    depends_on:
      - api
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data